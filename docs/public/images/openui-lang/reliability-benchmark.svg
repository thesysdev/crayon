<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1120"
  height="560"
  viewBox="0 0 1120 560"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Generation outcomes across formats</title>
  <desc id="description">
    OpenUI Lang completed 92.9 percent of generations and produced 2 blank screens. A2UI
    completed 92.4 percent and produced 53 blank screens. json-render completed 81.3 percent
    and produced 9 blank screens. Each format was evaluated across 1,104 generations.
  </desc>

  <style>
    .surface { fill: #ffffff; }
    .frame { fill: none; stroke: #e9e8ed; }
    .ink { fill: #17151d; }
    .muted { fill: #716e7b; }
    .faint { fill: #9895a1; }
    .rule { stroke: #e9e8ed; }
    .track { fill: #f0eff3; }
    .openui { fill: #7c3aed; }
    .a2ui { fill: #e03060; }
    .json-render { fill: #c98500; }
    text {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    .subtitle { font-size: 16px; font-weight: 400; }
    .panel-title { font-size: 17px; font-weight: 600; }
    .panel-hint { font-size: 14px; font-weight: 400; }
    .axis { font-size: 13px; font-weight: 400; }
    .format { font-size: 16px; font-weight: 500; }
    .value { font-size: 16px; font-weight: 600; }
    .note { font-size: 14px; font-weight: 400; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #17161a; }
      .frame { stroke: #323036; }
      .ink { fill: #f4f2f7; }
      .muted { fill: #b4b0bc; }
      .faint { fill: #8e8996; }
      .rule { stroke: #343138; }
      .track { fill: #29272d; }
      .openui { fill: #a78bfa; }
      .a2ui { fill: #f2678a; }
      .json-render { fill: #e5a83b; }
    }
  </style>

  <rect class="surface" x="0.5" y="0.5" width="1119" height="559" rx="20" />
  <rect class="frame" x="0.5" y="0.5" width="1119" height="559" rx="20" />

  <text class="title ink" x="48" y="57">Generation outcomes across formats</text>
  <text class="subtitle muted" x="48" y="88">
    No tested format eliminated incomplete generations or blank screens.
  </text>

  <text class="panel-title ink" x="200" y="145">Fully complete</text>
  <text class="panel-hint muted" x="200" y="169">Higher is better</text>

  <text class="panel-title ink" x="818" y="145">Fully blank</text>
  <text class="panel-hint muted" x="818" y="169">Lower is better</text>

  <line class="rule" x1="774" y1="128" x2="774" y2="409" />

  <text class="axis faint" x="200" y="200">0%</text>
  <text class="axis faint" x="442" y="200" text-anchor="middle">50%</text>
  <text class="axis faint" x="684" y="200" text-anchor="end">100%</text>
  <line class="rule" x1="200" y1="208" x2="200" y2="405" />
  <line class="rule" x1="442" y1="208" x2="442" y2="405" />
  <line class="rule" x1="684" y1="208" x2="684" y2="405" />

  <text class="axis faint" x="818" y="200">0</text>
  <text class="axis faint" x="929" y="200" text-anchor="middle">30</text>
  <text class="axis faint" x="1040" y="200" text-anchor="end">60</text>
  <line class="rule" x1="818" y1="208" x2="818" y2="405" />
  <line class="rule" x1="929" y1="208" x2="929" y2="405" />
  <line class="rule" x1="1040" y1="208" x2="1040" y2="405" />

  <rect class="openui" x="48" y="239" width="12" height="12" rx="2" />
  <text class="format ink" x="72" y="250">OpenUI Lang</text>
  <rect class="track" x="200" y="230" width="484" height="30" rx="3" />
  <rect class="openui" x="200" y="230" width="450" height="30" rx="3" />
  <text class="value ink" x="700" y="251">92.9%</text>
  <rect class="track" x="818" y="230" width="222" height="30" rx="3" />
  <rect class="openui" x="818" y="230" width="7.4" height="30" rx="3" />
  <text class="value ink" x="1056" y="251">2</text>

  <rect class="a2ui" x="48" y="309" width="12" height="12" rx="2" />
  <text class="format ink" x="72" y="320">A2UI</text>
  <rect class="track" x="200" y="300" width="484" height="30" rx="3" />
  <rect class="a2ui" x="200" y="300" width="447.2" height="30" rx="3" />
  <text class="value ink" x="700" y="321">92.4%</text>
  <rect class="track" x="818" y="300" width="222" height="30" rx="3" />
  <rect class="a2ui" x="818" y="300" width="196.1" height="30" rx="3" />
  <text class="value ink" x="1056" y="321">53</text>

  <rect class="json-render" x="48" y="379" width="12" height="12" rx="2" />
  <text class="format ink" x="72" y="390">json-render</text>
  <rect class="track" x="200" y="370" width="484" height="30" rx="3" />
  <rect class="json-render" x="200" y="370" width="393.5" height="30" rx="3" />
  <text class="value ink" x="700" y="391">81.3%</text>
  <rect class="track" x="818" y="370" width="222" height="30" rx="3" />
  <rect class="json-render" x="818" y="370" width="33.3" height="30" rx="3" />
  <text class="value ink" x="1056" y="391">9</text>

  <line class="rule" x1="48" y1="444" x2="1072" y2="444" />
  <text class="note muted" x="48" y="480">
    Six models · 46 prompts · four generations per prompt · 1,104 runs per format
  </text>
  <text class="note faint" x="48" y="510">
    Completion means everything requested rendered and every reference resolved. Blank screens are runs where users saw nothing.
  </text>
</svg>
