<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="-apple-system, 'Segoe UI', Inter, system-ui, sans-serif">
  <rect width="1200" height="675" fill="#0A0A11"/>
  <text x="60" y="80" font-size="36" font-weight="800" fill="#F4F3FA">Fully blank screens</text>
  <text x="60" y="110" font-size="17" fill="#8F8DA3">Runs where nothing rendered at all · 1,380 runs per format · lower is better</text>

  <!-- OpenUI: 4 -->
  <text x="60" y="246" font-size="22" font-weight="800" fill="#F4F3FA">OpenUI Lang</text>
  <rect x="330" y="210" width="700" height="56" rx="12" fill="rgba(255,255,255,0.05)"/>
  <rect x="330" y="210" width="28" height="56" rx="10" fill="#A78BFF"/>
  <text x="376" y="248" font-size="30" font-weight="800" fill="#A78BFF">4</text>

  <!-- json-render: 7 -->
  <text x="60" y="376" font-size="22" font-weight="800" fill="#F4F3FA">json-render</text>
  <rect x="330" y="340" width="700" height="56" rx="12" fill="rgba(255,255,255,0.05)"/>
  <rect x="330" y="340" width="77" height="56" rx="10" fill="#8E8E9C"/>
  <text x="425" y="378" font-size="30" font-weight="800" fill="#8E8E9C">11</text>

  <!-- A2UI: 100 -->
  <text x="60" y="506" font-size="22" font-weight="800" fill="#F4F3FA">A2UI</text>
  <rect x="330" y="470" width="700" height="56" rx="12" fill="rgba(255,255,255,0.05)"/>
  <rect x="330" y="470" width="623" height="56" rx="12" fill="#4E9CF5"/>
  <text x="937" y="508" font-size="30" font-weight="800" fill="#0A0A11" text-anchor="end">89</text>

  <text x="60" y="586" font-size="15" fill="#8F8DA3">89 counts only payloads that fail JSON parsing, blank in any client however lenient; A2UI's shipped all-or-nothing renderer blanks 100.</text>
  <text x="60" y="649" font-size="13" fill="#5C5A6E">openui-bench · 46 screen briefs · 73-component catalog · official SDK pipelines</text>
  <text x="1140" y="649" font-size="13" font-weight="700" fill="#8F8DA3" text-anchor="end">thesys.dev</text>
</svg>
