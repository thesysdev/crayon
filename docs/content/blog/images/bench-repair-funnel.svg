<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="-apple-system, 'Segoe UI', Inter, system-ui, sans-serif">
  <defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter></defs>
  <rect width="1200" height="675" fill="#0A0A11"/>
  <text x="60" y="80" font-size="36" font-weight="800" fill="#F4F3FA">What happens to a broken generation</text>
  <text x="60" y="110" font-size="17" fill="#8F8DA3">Recent production window: 277 generations failed validation and hit the repair pipeline</text>

  <!-- stacked bar -->
  <rect x="60" y="200" width="831" height="88" rx="16" fill="#34D3A6" filter="url(#soft)" opacity="0.35"/>
  <rect x="60" y="200" width="831" height="88" rx="16" fill="#34D3A6"/>
  <rect x="901" y="200" width="196" height="88" rx="16" fill="#E8B45A"/>
  <rect x="1107" y="200" width="33" height="88" rx="12" fill="#FF5470"/>

  <text x="84" y="240" font-size="26" font-weight="800" fill="#0A0A11">77%</text>
  <text x="84" y="266" font-size="15" font-weight="600" fill="#083D2E">fixed by rules, no LLM call</text>
  <text x="921" y="240" font-size="26" font-weight="800" fill="#0A0A11">19%</text>
  <text x="921" y="266" font-size="15" font-weight="600" fill="#3A2B08">one LLM pass</text>
  <text x="1123" y="252" font-size="15" font-weight="800" fill="#F4F3FA" text-anchor="middle">4%</text>

  <!-- legend rows -->
  <circle cx="72" cy="356" r="7" fill="#34D3A6"/>
  <text x="94" y="362" font-size="16" fill="#C9C7D4"><tspan font-weight="700" fill="#F4F3FA">214 screens repaired by rules.</tspan> Drop orphans, snap near-miss enums, trim extra arguments. No added wait.</text>

  <circle cx="72" cy="404" r="7" fill="#E8B45A"/>
  <text x="94" y="410" font-size="16" fill="#C9C7D4"><tspan font-weight="700" fill="#F4F3FA">52 screens repaired by one LLM pass.</tspan> The parser's exact error goes back to a small model that patches the output.</text>

  <circle cx="72" cy="452" r="7" fill="#FF5470"/>
  <text x="94" y="458" font-size="16" fill="#C9C7D4"><tspan font-weight="700" fill="#F4F3FA">11 screens fell through.</tspan> Mostly orphans and truncation.</text>

  <text x="60" y="548" font-size="28" font-weight="800" fill="#34D3A6">96% of would-be-broken screens shipped.</text>
  <text x="60" y="578" font-size="15" fill="#8F8DA3">Most repairs are rule-based and add no LLM latency; the single-pass retry receives the parser's exact error.</text>

  <text x="60" y="649" font-size="13" fill="#5C5A6E">openui-bench · production repair funnel · OpenUI Cloud</text>
  <text x="1140" y="649" font-size="13" font-weight="700" fill="#8F8DA3" text-anchor="end">thesys.dev</text>
</svg>
