name: Docs redirects

# Fails a pull request that removes or renames a docs-site page without adding a redirect for it
# in docs/next.config.mjs.
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/content/**"
      - "docs/app/**"
      - "docs/lib/source.ts"
      - "docs/next.config.mjs"
      - "docs/scripts/check-removed-urls.mjs"
      - ".github/workflows/docs-redirects.yml"

permissions:
  contents: read

jobs:
  removed-urls:
    name: Removed URLs have redirects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: v24.21.0
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @openuidev/docs

      - name: Check removed URLs
        working-directory: docs
        run: node scripts/check-removed-urls.mjs --base origin/${{ github.base_ref }}
