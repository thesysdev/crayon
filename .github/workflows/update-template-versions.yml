name: Update CLI Template Versions

# After a package publish, sync the CLI templates' @openuidev/* versions
on:
  workflow_run:
    workflows: ["Publish NPM packages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-template-versions:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Templates live in their own repo; the bot bumps them there. Needs a
      # token with write access to openui-templates (default GITHUB_TOKEN is
      # scoped to this repo only).
      - uses: actions/checkout@v6
        with:
          repository: thesysdev/openui-templates
          token: ${{ secrets.TEMPLATES_REPO_TOKEN }}
          path: openui-templates

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync template versions to workspace versions
        env:
          TEMPLATES_DIR: openui-templates
        run: node .github/scripts/update-template-versions.mjs

      - name: Open PR on openui-templates with the bumps
        uses: peter-evans/create-pull-request@v7
        with:
          path: openui-templates
          token: ${{ secrets.TEMPLATES_REPO_TOKEN }}
          branch: bot/update-template-versions
          title: "chore: bump template versions to latest published packages"
          commit-message: "chore: bump template versions to latest published packages"
          body: |
            Automated follow-up to a package publish in thesysdev/openui.

            - Syncs `@openuidev/*` versions in the templates to the published workspace versions
            - Regenerates template `package-lock.json` files
            - Merging this ships the new versions to `openui create` (templates are fetched from main)
          delete-branch: true
