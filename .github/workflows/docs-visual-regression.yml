name: Docs visual regression

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/react-ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-visual-regression.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/react-ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-visual-regression.yml"

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9.0.6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @openuidev/docs exec playwright install --with-deps chromium

      - name: Test light and dark themes
        run: pnpm --filter @openuidev/docs test:visual

      - name: Upload visual test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-visual-regression-results
          path: |
            docs/playwright-report
            docs/test-results
          if-no-files-found: ignore
          retention-days: 7
