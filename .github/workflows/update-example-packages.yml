name: Update example OpenUI packages

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-example-openui-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Update OpenUI packages
        run: pnpm examples:update

      - name: Install updated dependencies
        run: pnpm examples:install

      - name: Verify examples
        run: pnpm examples:verify

      - name: Create or update dependency pull request
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-example-openui-packages
        run: |
          set -euo pipefail

          if git diff --quiet -- ':(glob)examples/**/pnpm-lock.yaml' ':(glob)examples/**/package.json'; then
            echo "OpenUI example packages are already current."
            exit 0
          fi

          remote_sha="$(git ls-remote --heads origin "refs/heads/$UPDATE_BRANCH" | awk '{print $1}')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add ':(glob)examples/**/pnpm-lock.yaml' ':(glob)examples/**/package.json'
          git commit -m "chore(examples): update OpenUI packages"

          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$UPDATE_BRANCH:$remote_sha" origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -n "$existing_pr" ]]; then
            gh pr view "$existing_pr" --repo "$GITHUB_REPOSITORY" --json url --jq .url
            exit 0
          fi

          pr_body="Updates every example to the latest published versions of its \`@openuidev/*\` dependencies.

          The examples were installed from their refreshed lockfiles and all credential-free verification contracts passed before this pull request was created."

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "chore(examples): update OpenUI packages" \
            --body "$pr_body"
