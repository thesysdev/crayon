[package]
name = "openui-rust-tui"
version = "0.1.0"
edition = "2021"
description = "A Rust/ratatui terminal client that renders streamed OpenUI Lang via a Node bridge."

[[bin]]
name = "openui-rust-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
